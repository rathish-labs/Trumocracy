name: dco

# Developer Certificate of Origin check (see the DCO file at the repo root).
# Every commit in a pull request must carry a "Signed-off-by:" trailer (git commit -s).
# Implemented inline so the check depends on nothing outside this repository.

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every PR commit carries Signed-off-by
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha has no Signed-off-by trailer (use: git commit -s)"
              missing=1
            fi
          done < <(git rev-list --no-merges "$base".."$head")
          if [ "$missing" -ne 0 ]; then
            echo "One or more commits lack the DCO sign-off. See DCO and CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits are signed off."
