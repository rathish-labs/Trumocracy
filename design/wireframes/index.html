<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trumocracy — Wireframe Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1E2761; --navy2:#2E3D7E; --navy3:#3F4E96;
    --amber:#F2B134; --amber-deep:#D9971C;
    --ice:#CADCFC; --ice-deep:#AEC0E8;
    --paper:#F7F5EF; --paper2:#EFEBE0;
    --ink:#1B2440; --grey:#5A6685; --grey-soft:#8892AE;
    --green:#2C7A5B; --green-soft:#E7F1EC;
    --red:#B4483C; --line:#E4E1D6;
    --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:var(--sans); background:#0F1430; color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:28px 16px 60px;
    background-image:radial-gradient(1200px 600px at 20% -10%, #23306e 0%, transparent 60%),
                     radial-gradient(1000px 500px at 110% 110%, #23306e 0%, transparent 55%);
  }
  .head{max-width:760px;width:100%;text-align:center;margin-bottom:22px;color:#fff}
  .head h1{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:.3px}
  .head .amberdot{color:var(--amber)}
  .head p{color:var(--ice-deep);font-size:13.5px;margin-top:6px}
  .head .legend{display:inline-flex;gap:16px;margin-top:14px;flex-wrap:wrap;justify-content:center;font-size:11.5px;color:var(--ice)}
  .head .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .dot.anon{background:var(--grey-soft)} .dot.pub{background:var(--amber)} .dot.ver{background:var(--green)}

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:34px 26px; max-width:1360px; width:100%; justify-items:center;
  }
  .frame-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:320px}
  .frame-cap{color:var(--ice);font-size:12px;text-align:center;min-height:32px;line-height:1.35}
  .frame-cap b{color:#fff;font-weight:600;display:block;font-size:12.5px;margin-bottom:1px}

  /* phone */
  .phone{
    width:320px;height:672px;border-radius:42px;background:#0b0f24;
    padding:11px;
    box-shadow:0 22px 50px rgba(0,0,0,.5),0 0 0 2px #2a355f, inset 0 0 0 1px #000;
    position:relative;flex:none;
  }
  .screen{
    width:100%;height:100%;border-radius:32px;overflow:hidden;position:relative;
    background:var(--paper);display:flex;flex-direction:column;
  }
  .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#0b0f24;border-radius:0 0 16px 16px;z-index:40}
  .statusbar{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:11px;font-weight:600;color:var(--ink);z-index:30}
  .statusbar.on-navy{color:#fff}
  .statusbar .r{display:flex;gap:5px;align-items:center;font-size:10px}

  /* privacy status pill — the signature element */
  .privacy{
    flex:none;display:flex;align-items:center;gap:8px;margin:0 12px 0;padding:8px 12px;
    border-radius:12px;font-size:11.5px;font-weight:600;line-height:1.25;
  }
  .privacy .pdot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.5)}
  .privacy small{display:block;font-weight:500;font-size:10px;opacity:.85}
  .privacy.anon{background:#ECEEF5;color:#41496b} .privacy.anon .pdot{background:var(--grey-soft)}
  .privacy.ver{background:var(--green-soft);color:#1f5a42} .privacy.ver .pdot{background:var(--green)}
  .privacy.pub{background:#FDF3E0;color:#8a5b10} .privacy.pub .pdot{background:var(--amber)}

  .body{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 18px 20px}
  .body::-webkit-scrollbar{width:0}
  .body.navy{background:var(--navy);color:#fff}
  .body.paper{background:var(--paper)}

  .eyebrow{font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--amber-deep)}
  .body.navy .eyebrow{color:var(--amber)}
  h2.title{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.15;margin:7px 0 4px}
  .sub{font-size:12.5px;color:var(--grey);line-height:1.5}
  .body.navy .sub{color:var(--ice)}

  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 2px 6px rgba(30,39,97,.05)}
  .body.navy .card{background:var(--navy2);border-color:#41508f}
  .card h3{font-family:var(--serif);font-size:15px;font-weight:600;margin-bottom:3px}
  .card p{font-size:11.5px;color:var(--grey);line-height:1.5}
  .body.navy .card p{color:var(--ice)}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;border:none;font-family:var(--sans);font-weight:600;font-size:14px;cursor:pointer;transition:transform .06s,filter .15s;text-decoration:none}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--navy);color:#fff}
  .btn.amber{background:var(--amber);color:var(--ink)}
  .btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
  .body.navy .btn.ghost{color:#fff;border-color:#5566a5}
  .btn.mini{padding:10px;font-size:12.5px;border-radius:11px}
  .btnrow{display:flex;gap:9px;margin-top:12px}
  .btnrow .btn{flex:1}

  .foot{flex:none;padding:12px 18px 16px;border-top:1px solid var(--line);background:#fff}
  .body.navy + .foot{background:var(--navy);border-color:#41508f}

  .field{margin-top:11px}
  .field label{font-size:11px;font-weight:600;color:var(--grey);display:block;margin-bottom:5px}
  .field .inp{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:13px;color:var(--ink);font-family:var(--sans)}
  .field .inp.filled{color:var(--ink)} .field .inp.ph{color:var(--grey-soft)}
  .textarea{min-height:70px}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:10.5px;font-weight:600}
  .pill.green{background:var(--green-soft);color:#1f5a42}
  .pill.amber{background:#FDF3E0;color:#8a5b10}
  .pill.grey{background:#ECEEF5;color:#41496b}
  .pill.navy{background:#E7ECF9;color:var(--navy)}

  .rowitem{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .rowitem:last-child{border-bottom:none}
  .avatar{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:15px;color:#fff;background:var(--navy3)}
  .rowitem .meta{flex:1;min-width:0}
  .rowitem .meta b{font-size:13px;display:block}
  .rowitem .meta span{font-size:10.5px;color:var(--grey)}

  .bar{height:8px;background:var(--paper2);border-radius:6px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--amber);border-radius:6px}
  .bar.navybar{background:#41508f} .bar.navybar i{background:var(--amber)}

  .progresslabel{display:flex;justify-content:space-between;font-size:10.5px;color:var(--grey);margin-top:6px}
  .body.navy .progresslabel{color:var(--ice)}

  .steps{display:flex;gap:6px;margin:2px 0 4px}
  .steps i{flex:1;height:4px;border-radius:3px;background:var(--paper2)}
  .steps i.on{background:var(--amber)} .steps i.done{background:var(--green)}
  .body.navy .steps i{background:#41508f} .body.navy .steps i.on{background:var(--amber)} .body.navy .steps i.done{background:var(--green)}

  .note{display:flex;gap:9px;padding:11px;border-radius:12px;font-size:11px;line-height:1.45;margin-top:12px}
  .note.warn{background:#FDF3E0;color:#7a5210}
  .note.info{background:#E7ECF9;color:#2c3766}
  .note.good{background:var(--green-soft);color:#1f5a42}
  .note .ic{font-weight:700;flex:none}

  .vgroup{display:flex;flex-direction:column;gap:9px;margin-top:12px}
  .vopt{display:flex;align-items:center;gap:11px;padding:13px;border:1.5px solid var(--line);border-radius:13px;background:#fff}
  .vopt.sel{border-color:var(--navy);background:#F4F6FC}
  .vopt .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--grey-soft);flex:none;position:relative}
  .vopt.sel .radio{border-color:var(--navy)} .vopt.sel .radio::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--navy)}
  .vopt .vtext{flex:1} .vopt .vtext b{font-size:13px;display:block} .vopt .vtext span{font-size:10.5px;color:var(--grey)}

  .tabbar{flex:none;display:flex;justify-content:space-around;padding:9px 6px 12px;background:#fff;border-top:1px solid var(--line)}
  .body.navy ~ .tabbar{}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-weight:600;color:var(--grey-soft)}
  .tab.on{color:var(--navy)}
  .tab .ti{width:22px;height:22px;border-radius:7px;background:var(--paper2)}
  .tab.on .ti{background:var(--navy)}

  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .chip{padding:6px 11px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:500;color:var(--grey)}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

  .tally{display:flex;align-items:flex-end;gap:8px;height:70px;margin-top:12px;padding:0 4px}
  .tally .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:flex-end;height:100%}
  .tally .col i{width:100%;border-radius:6px 6px 0 0}
  .tally .col span{font-size:9.5px;color:var(--grey);font-weight:600}

  .flowlabel{grid-column:1/-1;width:100%;max-width:1360px;margin:14px 0 -12px;display:flex;align-items:center;gap:12px}
  .flowlabel .n{font-family:var(--serif);font-weight:600;color:var(--amber);font-size:15px;background:rgba(242,177,52,.12);width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
  .flowlabel .t{color:#fff;font-weight:600;font-size:15px}
  .flowlabel .d{color:var(--ice-deep);font-size:12px}
  .flowlabel .rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(174,192,232,.4),transparent)}

  .miniface{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:12px;color:#fff}
</style>
</head>
<body>

<div class="head">
  <h1>Trumocracy <span class="amberdot">·</span> Wireframe Prototype</h1>
  <p>Mobile · high-fidelity · the full arc from anonymous enrolment to governance. Not a build — a design-approval walkthrough.</p>
  <div class="legend">
    <span><i class="dot anon"></i> Anonymous (supporter)</span>
    <span><i class="dot ver"></i> Verified — counts, still private</span>
    <span><i class="dot pub"></i> Public by choice (worker / candidate)</span>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
/* ---------- builders ---------- */
function phone(caption, capTitle, inner){
  return `<div class="frame-wrap">
    <div class="phone"><div class="notch"></div><div class="screen">${inner}</div></div>
    <div class="frame-cap"><b>${capTitle}</b>${caption}</div>
  </div>`;
}
function sbar(dark){return `<div class="statusbar ${dark?'on-navy':''}"><span>9:41</span><span class="r">● ▂▄▆ ▉</span></div>`;}
function privacy(kind){
  const map={
    anon:['anon','Anonymous','Nothing you do here is linked to you'],
    ver:['ver','Verified — private','Your vote counts. Your identity is not stored'],
    pub:['pub','Public','You chose a public role. Your record is visible']
  };
  const[c,t,s]=map[kind];
  return `<div class="privacy ${c}"><span class="pdot"></span><span>${t}<small>${s}</small></span></div>`;
}
function flow(n,t,d){return `<div class="flowlabel"><span class="n">${n}</span><span class="t">${t}</span><span class="rule"></span><span class="d">${d}</span></div>`;}

const S=[];

/* ============ FLOW 1 — CORE IDENTITY ============ */
S.push(flow('1','Core identity','Anonymous → verified → join a party'));

// 1.1 welcome
S.push(phone('First open. The promise, stated plainly — no signup wall.','Welcome',
  sbar(true)+
  `<div class="body navy" style="display:flex;flex-direction:column;justify-content:center;text-align:center;padding-top:40px">
    <div class="eyebrow" style="text-align:center">A space citizens control</div>
    <h2 class="title" style="font-size:27px;margin-top:10px">Start a party.<br>Join a party.<br>Hold it to account.</h2>
    <p class="sub" style="margin-top:12px">One person, one vote. Your ballot stays private. No party boss, no gatekeeper, no one who can override the rules — including us.</p>
    <div style="margin-top:auto"></div>
  </div>`+
  `<div class="foot"><a class="btn amber" href="#">Explore — no account needed</a><a class="btn ghost" href="#" style="margin-top:9px">I have an invite</a></div>`
));

// 1.2 browse anonymous
S.push(phone('Anonymous by default. Read everything before deciding anything.','Browse anonymously',
  sbar()+privacy('anon')+
  `<div class="body paper">
    <div class="eyebrow">Parties near you · Bengaluru South</div>
    <h2 class="title" style="font-size:19px">Active in your region</h2>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:start"><h3>Clean Commute Coalition</h3><span class="pill green">Active</span></div>
      <p>Transport, air quality, last-mile access. Founded by residents, not backers.</p>
      <div class="bar"><i style="width:100%"></i></div><div class="progresslabel"><span>12,480 verified members</span><span>Est. 2026</span></div></div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:start"><h3>Ward Water Trust</h3><span class="pill amber">Petition · 68%</span></div>
      <p>Piped water accountability across 40 wards. Needs 32% more to activate.</p>
      <div class="bar"><i style="width:68%"></i></div><div class="progresslabel"><span>6,120 endorsements</span><span>Threshold: 9,000</span></div></div>
  </div>`+
  `<div class="tabbar"><div class="tab on"><i class="ti"></i>Discover</div><div class="tab"><i class="ti"></i>Parties</div><div class="tab"><i class="ti"></i>Activity</div><div class="tab"><i class="ti"></i>You</div></div>`
));

// 1.3 verify intro
S.push(phone('The optional step. What it is, what it never does. Honesty up front.','Verify — the offer',
  sbar()+privacy('anon')+
  `<div class="body paper">
    <div class="eyebrow">Optional · one time</div>
    <h2 class="title">Become a counting member</h2>
    <p class="sub">You can read, follow and support anonymously forever. To have your vote <b>count</b> or to stand as a candidate, prove you're one real person — once.</p>
    <div class="note good"><span class="ic">✓</span><div>Done on your phone. We receive a proof, never your ID. Nothing about who you are is stored — not even encrypted.</div></div>
    <div class="note info"><span class="ic">ⓘ</span><div>If a court ordered us to reveal who's in a party, we couldn't. We don't hold that data by design.</div></div>
    <div class="card"><h3 style="font-size:13px">What it unlocks</h3>
      <p>· Your vote counts in binding decisions<br>· You may stand as a candidate<br>· A private "verified" mark only you can see</p></div>
  </div>`+
  `<div class="foot"><a class="btn primary" href="#">Verify with Aadhaar</a><a class="btn ghost" href="#" style="margin-top:9px">Maybe later</a></div>`
));

// 1.4 verify on-device
S.push(phone('On-device. The raw credential never leaves the phone.','Verify — on your device',
  sbar()+privacy('anon')+
  `<div class="body paper">
    <div class="steps"><i class="done"></i><i class="on"></i><i></i></div>
    <div class="eyebrow">Step 2 of 3 · on this device</div>
    <h2 class="title">Generating your proof</h2>
    <p class="sub">Your Aadhaar data is being read and proven right here on your phone. Only a one-way proof leaves — the document does not.</p>
    <div class="card" style="text-align:center;padding:26px 14px">
      <div style="width:56px;height:56px;border-radius:16px;background:var(--navy);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px">🔐</div>
      <h3 style="font-size:14px">Building zero-knowledge proof</h3>
      <p style="margin-top:4px">Proving: valid credential · region eligible · unique person</p>
      <div class="bar" style="margin-top:14px"><i style="width:72%"></i></div>
    </div>
    <div class="note info"><span class="ic">ⓘ</span><div>What we'll receive: a proof and a one-way fingerprint. What we won't: your name, number, or address.</div></div>
  </div>`+
  `<div class="foot"><a class="btn primary" href="#" style="opacity:.55">Please wait…</a></div>`
));

// 1.5 verified success
S.push(phone('The privacy pill flips to green. Verified — and still anonymous.','Verified',
  sbar()+privacy('ver')+
  `<div class="body paper" style="text-align:center">
    <div style="margin-top:18px;width:70px;height:70px;border-radius:22px;background:var(--green);margin-left:auto;margin-right:auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px">✓</div>
    <h2 class="title" style="margin-top:14px">You're verified</h2>
    <p class="sub">Your vote now counts. You're still anonymous — this mark is visible to you alone.</p>
    <div class="card" style="text-align:left"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:13px">Verified · private</h3><span class="pill green">Only you see this</span></div>
      <p>No one can tell you're verified. The public sees only totals, like "12,480 verified members".</p></div>
    <div class="note good" style="text-align:left"><span class="ic">✓</span><div>Try to verify again and you'll be recognised as the same person — so no one can enrol twice or use your name.</div></div>
  </div>`+
  `<div class="foot"><a class="btn amber" href="#">Find your party</a></div>`
));

// 1.6 join party
S.push(phone('Join with no approval. Read the constitution first — it\'s public.','Join a party',
  sbar()+privacy('ver')+
  `<div class="body paper">
    <div class="eyebrow">Clean Commute Coalition</div>
    <h2 class="title">Join this party</h2>
    <p class="sub">No approval, no interview, no fee. Everyone stands equal from day one.</p>
    <div class="card"><h3 style="font-size:13px">Before you join</h3><p>You can belong to one party at a time. Your vote here counts one month after joining — waived while a party is under three months old.</p></div>
    <div class="rowitem"><span class="pill navy">Public</span><div class="meta" style="margin-left:2px"><b>Constitution</b><span>Read the full rules · updated Mar 2026</span></div><span style="color:var(--grey-soft)">›</span></div>
    <div class="rowitem"><span class="pill navy">Public</span><div class="meta" style="margin-left:2px"><b>Manifesto & plans</b><span>1 / 3 / 5 / 10 / 30-year commitments</span></div><span style="color:var(--grey-soft)">›</span></div>
    <div class="rowitem"><span class="pill navy">Public</span><div class="meta" style="margin-left:2px"><b>Finances</b><span>Every rupee in and out</span></div><span style="color:var(--grey-soft)">›</span></div>
  </div>`+
  `<div class="foot"><a class="btn primary" href="#">Join — as an equal member</a></div>`
));

/* ============ FLOW 2 — PARTY LIFECYCLE ============ */
S.push(flow('2','Party lifecycle','Create a party from a petition, publicly'));

// 2.1 create — eight pillars
S.push(phone('Any citizen starts here. Eight pillars — the vision must be whole.','Create a party · vision',
  sbar()+privacy('ver')+
  `<div class="body paper">
    <div class="steps"><i class="on"></i><i></i><i></i></div>
    <div class="eyebrow">New party · step 1 of 3</div>
    <h2 class="title">Your eight-pillar vision</h2>
    <p class="sub">A party must speak to the whole of life, not one issue. Fill each pillar — the platform checks all eight are present, never what they say.</p>
    <div class="chips"><span class="chip on">Finance ✓</span><span class="chip on">Society ✓</span><span class="chip on">Governance ✓</span><span class="chip">Law</span><span class="chip">Education</span><span class="chip">Health</span><span class="chip">Security</span><span class="chip">Region</span></div>
    <div class="field"><label>Governance — your commitment</label><div class="inp filled">Ward-level participatory budgeting, published quarterly with evidence.</div></div>
    <div class="field"><label>Law — your commitment</label><div class="inp ph">Describe your stance…</div></div>
  </div>`+
  `<div class="foot"><div class="progresslabel" style="margin:0 0 8px"><span>3 of 8 pillars complete</span><span>All required</span></div><a class="btn primary" href="#">Continue</a></div>`
));

// 2.2 constitution + non-violence
S.push(phone('The constitution. Non-violence is a required clause — not optional.','Create · constitution',
  sbar()+privacy('ver')+
  `<div class="body paper">
    <div class="steps"><i class="done"></i><i class="on"></i><i></i></div>
    <div class="eyebrow">New party · step 2 of 3</div>
    <h2 class="title">Set the rules</h2>
    <p class="sub">Your party's public constitution. Members join under these — and can amend them by vote later.</p>
    <div class="field"><label>Membership</label><div class="inp filled">Open to all · one member, one vote</div></div>
    <div class="field"><label>Candidate selection</label><div class="inp filled">By member vote after 3 debates · no incumbency</div></div>
    <div class="field"><label>Removal of a representative</label><div class="inp filled">Recall by affirmative member vote</div></div>
    <div class="card" style="border-color:var(--navy);background:#F4F6FC"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:13px">Non-violence clause</h3><span class="pill navy">Required</span></div><p>Every party on the platform commits to non-violence. This clause cannot be removed.</p></div>
  </div>`+
  `<div class="foot"><a class="btn primary" href="#">Continue to launch</a></div>`
));

// 2.3 petition state (live)
S.push(phone('Live and public before it\'s legal. Status shown honestly, capped at 100.','Petition · live onboarding',
  sbar()+privacy('ver')+
  `<div class="body paper">
    <div style="display:flex;justify-content:space-between;align-items:center"><div class="eyebrow">Provisional party</div><span class="pill amber">Petition</span></div>
    <h2 class="title">Ward Water Trust</h2>
    <p class="sub">Everything is public already — constitution, plans, manifesto. Legal registration is under way and shown live.</p>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:13px">Support threshold</h3><span style="font-size:11px;color:var(--grey)">68%</span></div>
      <div class="bar"><i style="width:68%"></i></div><div class="progresslabel"><span>6,120 endorsements</span><span>9,000 to activate</span></div></div>
    <div class="card"><h3 style="font-size:13px">Onboarding status · live</h3>
      <div class="rowitem" style="padding:8px 0"><span class="pill green">Done</span><div class="meta"><b>Constitution published</b></div></div>
      <div class="rowitem" style="padding:8px 0"><span class="pill green">Done</span><div class="meta"><b>Founding evidence attached</b></div></div>
      <div class="rowitem" style="padding:8px 0"><span class="pill amber">In progress</span><div class="meta"><b>Legal registration</b><span>Founders' responsibility · updates live</span></div></div>
    </div>
    <div class="note warn"><span class="ic">!</span><div>Membership caps at 100 until legal verification completes — so an unverified party can't gather false strength.</div></div>
  </div>`+
  `<div class="foot"><a class="btn amber" href="#">Endorse this petition</a></div>`
));

/* ============ FLOW 3 — GOVERNANCE ============ */
S.push(flow('3','Governance','Propose · debate · choose candidates · vote'));

// 3.1 proposal lifecycle
S.push(phone('Every decision has a visible lifecycle and a permanent trail.','Proposal lifecycle',
  sbar()+privacy('ver')+
  `<div class="body paper">
    <div class="eyebrow">Clean Commute Coalition · proposal</div>
    <h2 class="title">Night-bus pilot on Route 9</h2>
    <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
      <span class="pill green">Proposed ✓</span><span class="pill green">Discussed ✓</span><span class="pill amber">Debate ●</span><span class="pill grey">Vote</span><span class="pill grey">Decision</span></div>
    <div class="card"><p style="color:var(--ink);font-size:12.5px;line-height:1.55">Extend Route 9 to a midnight service for shift workers, funded from the ward transport line. Six-month pilot, measured on ridership and safety reports.</p></div>
    <div class="rowitem"><div class="avatar" style="background:var(--amber);color:var(--ink)">R</div><div class="meta"><b>Proposed by a Worker</b><span>Author is public · agenda-setting is visible</span></div></div>
    <div class="note info"><span class="ic">ⓘ</span><div>Anyone may post a competing proposal on the same question — the author never owns the ballot alone.</div></div>
  </div>`+
  `<div class="foot"><a class="btn primary" href="#">Read the debate</a></div>`
));

// 3.2 candidate + debate
S.push(phone('Candidates public by choice, chosen after 3 local debates — never by incumbency.','Candidate selection',
  sbar()+privacy('ver')+
  `<div class="body paper">
    <div class="eyebrow">Ward 12 · choosing a candidate</div>
    <h2 class="title">Three debates, then you decide</h2>
    <div class="card" style="padding:11px"><div class="rowitem" style="padding:6px 0"><span class="pill green">Done</span><div class="meta"><b>Debate 1 — Local conditions</b></div></div>
      <div class="rowitem" style="padding:6px 0"><span class="pill green">Done</span><div class="meta"><b>Debate 2 — People's problems</b></div></div>
      <div class="rowitem" style="padding:6px 0"><span class="pill amber">Tonight</span><div class="meta"><b>Debate 3 — The work required</b></div></div></div>
    <div class="rowitem"><div class="miniface" style="background:var(--navy3)">AK</div><div class="meta"><b>Ayesha K. <span class="pill pub" style="background:#FDF3E0;color:#8a5b10;margin-left:4px">Public</span></b><span>Full disclosure · record open</span></div><span class="pill navy">+3 / −1</span></div>
    <div class="rowitem"><div class="miniface" style="background:var(--navy3)">DM</div><div class="meta"><b>Daniel M. <span class="pill pub" style="background:#FDF3E0;color:#8a5b10;margin-left:4px">Public</span></b><span>Full disclosure · record open</span></div><span class="pill navy">+3 / −1</span></div>
    <div class="note info"><span class="ic">ⓘ</span><div>No automatic renomination. Being the sitting rep counts for nothing here.</div></div>
  </div>`+
  `<div class="foot"><a class="btn primary" href="#">Watch tonight's debate</a></div>`
));

// 3.3 the vote — coercion-safe
S.push(phone('The signature safety screen: identical for every choice, safe to show a coercer.','Cast a vote',
  sbar()+privacy('ver')+
  `<div class="body paper">
    <div class="eyebrow">Binding vote · closes in 2 days</div>
    <h2 class="title">Night-bus pilot on Route 9</h2>
    <p class="sub">One person, one vote. Private — you can change it until voting closes.</p>
    <div class="vgroup">
      <div class="vopt sel"><span class="radio"></span><div class="vtext"><b>In favour</b><span>Run the six-month pilot</span></div></div>
      <div class="vopt"><span class="radio"></span><div class="vtext"><b>Against</b><span>Do not run it</span></div></div>
      <div class="vopt"><span class="radio"></span><div class="vtext"><b>Abstain</b><span>No preference recorded</span></div></div>
    </div>
    <div class="note warn"><span class="ic">!</span><div>Coercion-resistant voting isn't on yet in this build — this warning shows whenever it's off, by default.</div></div>
  </div>`+
  `<div class="foot"><a class="btn primary" href="#">Cast vote privately</a></div>`
));

// 3.4 confirmation — coercion-safe + tally
S.push(phone('Confirmation never names your choice — identical whatever you picked. Only the tally is public.','Vote confirmed',
  sbar()+privacy('ver')+
  `<div class="body paper" style="text-align:center">
    <div style="margin-top:14px;width:64px;height:64px;border-radius:20px;background:var(--navy);margin-left:auto;margin-right:auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px">✓</div>
    <h2 class="title" style="margin-top:12px">Your vote is in</h2>
    <p class="sub">You can change it any time before voting closes. This screen looks the same for every choice — safe to show anyone.</p>
    <div class="card" style="text-align:left"><h3 style="font-size:13px">Where the whole party stands</h3>
      <div class="tally">
        <div class="col"><i style="height:64%;background:var(--green)"></i><span>For</span></div>
        <div class="col"><i style="height:30%;background:var(--red)"></i><span>Against</span></div>
        <div class="col"><i style="height:14%;background:var(--grey-soft)"></i><span>Abstain</span></div>
      </div>
      <p style="margin-top:10px">Totals are public. Individual votes never are — not even yours, to us.</p></div>
  </div>`+
  `<div class="foot"><a class="btn ghost" href="#">Change my vote</a></div>`
));

// 3.5 accountability dashboard
S.push(phone('The transparency surface: promises held to evidence, active/inactive, nothing deleted.','Accountability dashboard',
  sbar(true)+
  `<div class="body navy">
    <div class="eyebrow">Clean Commute Coalition</div>
    <h2 class="title">Promises &amp; performance</h2>
    <p class="sub">Every commitment carries a baseline, a target and evidence. The platform reports facts — it doesn't grade.</p>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:13px">Cut bus wait times 30%</h3><span class="pill green">On track</span></div>
      <p>Baseline 14 min → target 10 min · now 11.5 min</p><div class="bar navybar"><i style="width:71%"></i></div></div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:13px">Publish ward budgets</h3><span class="pill amber">Delayed</span></div>
      <p>Committed Q1 · evidence attached · reason logged</p><div class="bar navybar"><i style="width:40%"></i></div></div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:13px">Night-bus pilot</h3><span class="pill navy" style="background:#41508f;color:#fff">Inactive</span></div>
      <p>Superseded, not deleted · full history kept</p></div>
  </div>`+
  `<div class="tabbar"><div class="tab"><i class="ti"></i>Discover</div><div class="tab"><i class="ti"></i>Parties</div><div class="tab on"><i class="ti"></i>Activity</div><div class="tab"><i class="ti"></i>You</div></div>`
));

// 3.6 the one-way door — become public
S.push(phone('The crossing. Anonymous→public is deliberate, warned, and one-way.','The one-way door',
  sbar()+privacy('ver')+
  `<div class="body paper">
    <div class="eyebrow">Become a Worker</div>
    <h2 class="title">This step is permanent and public</h2>
    <p class="sub">Workers can propose, organise and run committees. In return, your contribution record becomes public — and stays that way.</p>
    <div class="note warn"><span class="ic">!</span><div><b>Read before you confirm.</b> What you've done as an anonymous supporter stays anonymous forever. It is never linked to your new public identity.</div></div>
    <div class="card"><h3 style="font-size:13px">After this, publicly visible</h3><p>· Proposals you author<br>· Committees you run<br>· Your contribution history from here on</p></div>
    <div class="privacy pub" style="margin:12px 0 0"><span class="pdot"></span><span>You'll become Public<small>Your status pill turns amber — for good</small></span></div>
  </div>`+
  `<div class="foot"><div class="btnrow"><a class="btn ghost mini" href="#">Stay anonymous</a><a class="btn amber mini" href="#">I understand — go public</a></div></div>`
));

document.getElementById('grid').innerHTML = S.join('');
</script>
</body>
</html>
